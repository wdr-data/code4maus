x-local-storage: &local-storage
  AWS_ACCESS_KEY_ID: code4maus-local
  AWS_SECRET_ACCESS_KEY: code4maus-local-secret
  AWS_REGION: eu-central-1
  STORAGE_BUCKET: code4maus-local
  STORAGE_ENDPOINT: http://storage:8333

services:
  storage:
    image: chrislusf/seaweedfs:4.46
    command: mini -dir=/data -ip=storage
    environment:
      <<: *local-storage
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - storage_data:/data

  storage-seed:
    image: node:24-bookworm
    working_dir: /src
    command: yarn storage:seed
    environment:
      <<: *local-storage
    depends_on:
      dependencies:
        condition: service_completed_successfully
      storage:
        condition: service_started
    volumes:
      - .:/src:ro
      - node_modules:/src/node_modules:ro
    init: true

  dependencies:
    image: node:24-bookworm
    working_dir: /src
    command: yarn install --frozen-lockfile
    volumes:
      - .:/src
      - node_modules:/src/node_modules
    init: true

  frontend:
    image: node:24-bookworm
    working_dir: /src
    command: yarn start
    env_file: .env
    environment:
      API_PROXY_TARGET: http://backend:3000
      PROXY_TARGET: http://storage:8333/code4maus-local
      PORT: 8601
      DOCKER_WATCH: '1'
    depends_on:
      dependencies:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:8601:8601'
    volumes:
      - .:/src
      - node_modules:/src/node_modules
      - frontend_cache:/src/.cache
      - frontend_build:/src/build
    init: true

  backend:
    image: node:24-bookworm
    working_dir: /src
    command: yarn start:backend
    environment:
      <<: *local-storage
      STORAGE_ENDPOINT_FRONTEND: http://localhost:8333
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      AWS_SDK_LOAD_CONFIG: '1'
    depends_on:
      dependencies:
        condition: service_completed_successfully
      storage-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/src
      - node_modules:/src/node_modules
      - backend_cache:/src/.cache
    init: true

volumes:
  node_modules:
  backend_cache:
  frontend_cache:
  frontend_build:
  storage_data:
